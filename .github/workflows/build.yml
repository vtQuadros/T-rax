name: Test build

# Build that publishes nothing: the installers are attached to the run as downloadable
# artifacts, to try a version (e.g. on Windows) before releasing it.
# Trigger it with a tag: build-windows-<n>, build-linux-<n>, or build-<n> for both.
on:
  push:
    tags: ["build-*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Which installers to build
        type: choice
        options: [windows, linux, both]
        default: windows

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            bundles: deb,appimage
          - os: windows-latest
            name: windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip platforms that were not requested
        id: want
        shell: bash
        run: |
          want="${{ inputs.platform }}"
          if [ -z "$want" ]; then
            case "${{ github.ref_name }}" in
              build-windows-*) want=windows ;;
              build-linux-*) want=linux ;;
              *) want=both ;;
            esac
          fi
          if [ "$want" = both ] || [ "$want" = "${{ matrix.name }}" ]; then echo "build=true"; else echo "build=false"; fi >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.want.outputs.build == 'true'

      - name: Linux system packages
        if: steps.want.outputs.build == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf

      - uses: actions/setup-node@v5
        if: steps.want.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.want.outputs.build == 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.want.outputs.build == 'true'
        with:
          workspaces: src-tauri

      - name: Build
        if: steps.want.outputs.build == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.build == 'true'
        with:
          name: T-rax-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
